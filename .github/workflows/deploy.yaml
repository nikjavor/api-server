name: Deploy on DigitalOcean

on:
  push:
    branches:
      - prod

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    outputs:
      image: ghcr.io/nikjavor/api-server:latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ghcr.io/nikjavor/api-server:latest

  deploy:
    runs-on: ubuntu-latest
    needs: build # 👈 wait for build job

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USER }}
          key: ${{ secrets.DO_SSH_SECRET_KEY }}
          script: |
            set -e

            cd ~/api-server
            git pull origin prod

            docker compose pull
            docker compose up -d
            docker image prune -f
